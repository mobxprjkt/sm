name: "Release (reusable)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


on:
  workflow_call:
    inputs:
      zip_mode:   { type: string, required: true }
      build_type: { type: string, required: true }
      start_time: { type: string, required: true }
      workflow_type: { type: string, default: aio }
      nuke_release: { type: boolean, default: true }
      use_ccache: { type: boolean, default: false }

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: "Package & Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4.3.0
        with:
          path: ./artifacts/

      - name: "Resolve versions"
        run: bash scripts/resolve-versions.sh
        env:
          BUILD_TYPE:    ${{ inputs.build_type }}
          WORKFLOW_TYPE: ${{ inputs.workflow_type }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: "Setup Android SDK and NDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android NDK"
        run: sdkmanager "ndk;28.0.13004108"

      - name: "Install cross and just"
        run: |
          cargo install cross --locked
          cargo install just --locked

      - name: "Build SukiSU Ultra Manager from source"
        env:
          SKSU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          SKSU_REF: main
        run: bash scripts/build-sksu-manager.sh

      - name: "Collect / bundle ZIPs"
        env:
          ZIP_MODE:   ${{ inputs.zip_mode }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: bash scripts/pack-release.sh

      - name: "Fetch manager APKs"
        env:
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          KSUN_MANAGER_ARTIFACT_ID:          ${{ env.KSUN_MANAGER_ARTIFACT_ID }}
          KSUN_MANAGER_SPOOFED_ARTIFACT_ID:  ${{ env.KSUN_MANAGER_SPOOFED_ARTIFACT_ID }}
          RSKU_MANAGER_ARTIFACT_ID:          ${{ env.RSKU_MANAGER_ARTIFACT_ID }}
          RSKU_MANAGER_SPOOFED_ARTIFACT_ID:  ${{ env.RSKU_MANAGER_SPOOFED_ARTIFACT_ID }}
          SKSU_MANAGER_ARTIFACT_ID:          ${{ env.SKSU_MANAGER_ARTIFACT_ID }}
          SKSU_MANAGER_SPOOFED_ARTIFACT_ID:  ${{ env.SKSU_MANAGER_SPOOFED_ARTIFACT_ID }}
          KSUN_VERSION:                      ${{ env.KSUN_VERSION }}
          RSKU_VERSION:                      ${{ env.RSKU_VERSION }}
        run: bash scripts/fetch-manager-apks.sh


      - name: "Release body"
        env:
          BUILD_TYPE:        ${{ inputs.build_type }}
          USE_CCACHE:        ${{ inputs.use_ccache }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA:        ${{ github.sha }}
          WORKFLOW_TYPE:     ${{ inputs.workflow_type }}
          RUN_URL:           "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO:              ${{ github.repository }}
          SHA:               ${{ github.sha }}
          RUN_NUMBER:        ${{ github.run_number }}
        run: bash scripts/release-notes.sh

      - name: "Nuke ALL existing release assets (opt-in)"
        if: ${{ inputs.nuke_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[NUKE] nuke_release=true — clearing all existing assets on $RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json assets \
            -q '.assets[].name' 2>/dev/null \
            | xargs -r -I{} gh release delete-asset \
                "$RELEASE_TAG" {} --yes 2>/dev/null || true

      - name: "Purge old AK3 assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json assets \
            -q '.assets[].name' 2>/dev/null \
            | grep '^AK3-' \
            | xargs -r -I{} gh release delete-asset \
                "$RELEASE_TAG" {} --yes 2>/dev/null || true

      - name: "Create release"
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          overwrite_files: true
          files: |
            ./release_zips/*.zip
            ./manager_apks/*.apk
          tag_name:   ${{ env.RELEASE_TAG }}
          name:       ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body:       ${{ env.RELEASE_BODY }}

